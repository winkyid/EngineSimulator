<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engine Maker 1.0</title>
<style>
:root{--bg:#eceff3;--fg:#15181d;--pn:#fffffff2;--ln:#c9ced6;--ac:#e8590c;--mu:#5b6370;--ch:#f3f5f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--fg:#e8eaee;--pn:#1a1d23f2;--ln:#2d323b;--mu:#8b93a1;--ch:#23272f}}
:root[data-theme="dark"]{--bg:#101216;--fg:#e8eaee;--pn:#1a1d23f2;--ln:#2d323b;--mu:#8b93a1;--ch:#23272f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#title{position:absolute;top:12px;left:14px;font-weight:800;letter-spacing:.08em;font-size:14px}
#title small{color:var(--ac);margin-left:6px}
#tg{position:absolute;top:10px;right:12px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px}
#sd,#ign{position:absolute;top:40px;left:14px;background:var(--pn);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
#ign{top:74px}
#ctl{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#dead{display:none;position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);flex-direction:column;align-items:center;gap:8px;background:var(--pn);border:2px solid #e03131;border-radius:14px;padding:14px 18px;text-align:center;font-size:13px;z-index:5}
#dead b{font-size:18px;color:#e03131}#dead button{background:#e03131;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700}
#hud{flex:1 1 100%;order:-1;min-width:0;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px}
#gearbox{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px}
#gtrack{position:relative;width:118px;height:136px;touch-action:none}
.gb{position:absolute;border-radius:3px;background:var(--ln)}
#knob{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;transition:left .12s,top .12s;box-shadow:0 3px 8px #0005;pointer-events:none}
.tk{position:absolute;width:18px;text-align:center;font-size:12px;color:var(--mu)}
#pedal{width:88px;height:140px;border-radius:16px;border:1px solid var(--ln);background:repeating-linear-gradient(0deg,var(--ch) 0 10px,var(--ln) 10px 13px);color:var(--fg);font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none;transform:perspective(260px) rotateX(calc(var(--t,0)*26deg));transform-origin:bottom}
#pedal.on{border-color:var(--ac);color:var(--ac)}
#bar{height:6px;background:var(--ln);border-radius:3px;margin:6px 0 4px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac)}
#hud b{font-size:15px}
.st{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.st span{color:var(--mu)}
#rpm{width:100%;accent-color:var(--ac)}
#panel{width:290px;background:var(--pn);border-left:1px solid var(--ln);padding:14px;overflow-y:auto;display:none}
#panel.open{display:block}
h3{margin:14px 0 6px;font-size:12px;color:var(--mu);letter-spacing:.06em}
h3:first-of-type{margin-top:0}
.hd{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.hd button{background:none;border:0;color:var(--fg);font-size:20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g button,.chip{background:var(--ch);color:var(--fg);border:1px solid var(--ln);border-radius:9px;padding:9px 6px;font-size:13px}
.g button.on,.chip.on{border-color:var(--ac);background:var(--ac);color:#fff;font-weight:700}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{text-align:left;padding:10px}
label{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{display:flex;gap:8px}
.sw i{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);cursor:pointer}
.sw i.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
@media(max-width:700px){#app{flex-direction:column}#panel{width:auto;max-height:46%;flex:none;border-left:0;border-top:1px solid var(--ln)}}
#clutch{margin-left:auto}
#brake,#clutch{width:64px;height:100px;border-radius:14px;border:1px solid var(--ln);background:repeating-linear-gradient(0deg,var(--ch) 0 10px,var(--ln) 10px 13px);color:var(--fg);font-weight:800;font-size:10px;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
#brake.on{border-color:#e03131;color:#e03131;transform:scale(.95)}
#clutch.on{border-color:#2f6fd0;color:#2f6fd0;transform:scale(.95)}
@media(max-width:700px){#brake,#clutch{width:50px}#pedal{width:66px}#gearbox{padding:6px}#hud{padding:8px;font-size:12px}}
#lang{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000a}
#lang.open{display:flex}
.lbox{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px;width:min(320px,86vw);text-align:center}
.lbox b{display:block;margin-bottom:12px;font-size:14px}
#lopts{display:grid;gap:8px}
#lopts button{padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--ch);color:var(--fg);font-size:15px;font-weight:700}
#lopts button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body>
<div id="app">
<div id="stage"><canvas id="c"></canvas>
<div id="title">ENGINE MAKER<small>1.0</small></div>
<button id="tg">⚙ Engine Maker</button>

<button id="ign">🔑 Start engine</button>
<div id="dead"><b data-i="dead_t"></b><span data-i="dead_d"></span><button id="fix" data-i="fix"></button></div>

<div id="hud"><div class="st"><b id="nm"></b><span id="cc"></span></div>
<div class="st"><span id="hp"></span><span id="tq"></span></div>
<div class="st" style="margin:0"><b id="sp" style="font-size:22px">0</b><span>km/h</span><b id="gr" style="margin-left:auto;font-size:18px">N</b></div>
<div id="bar"><i id="bi"></i></div><span id="rv" style="color:var(--mu);font-size:12px"></span></div>
<button id="clutch" data-i="clutch"></button>
<button id="brake" data-i="brake"></button>
<button id="pedal" data-i="gas"></button></div></div>

<div class="hd"><span data-i="title"></span><button id="cl">×</button></div>
<h3 data-i="h_layout"></h3><div class="g" id="types"></div>
<div class="chips" style="margin-top:6px"><button class="chip" id="twinb"></button></div>
<h3 data-i="h_dim"></h3>
<label><span data-i="bore"></span><span id="bv"></span></label><input type="range" id="bore" min="50" max="100" value="70">
<label><span data-i="stroke"></span><span id="sv"></span></label><input type="range" id="stroke" min="50" max="100" value="70">

<div id="ecuP" style="display:none"><label><span data-i="map"></span><span id="mv"></span></label><input type="range" id="emap" min="0" max="30" value="10">
<label><span data-i="lim"></span><span id="lv"></span></label><input type="range" id="elim" min="-10" max="20" value="0">
<div id="bw"><label><span data-i="bst"></span><span id="bv2"></span></label><input type="range" id="ebst" min="0" max="50" value="10"></div></div>
<h3 data-i="h_lang"></h3><div class="g" id="langs"></div>
<h3 data-i="h_bg"></h3><div class="sw" id="bgs"></div>
<h3 data-i="h_snd"></h3><label><span data-i="vol"></span><span id="vv">70%</span></label><input type="range" id="vol" min="0" max="100" value="70">
<h3 data-i="h_col"></h3><div class="sw" id="sw"></div>
</aside></div>
